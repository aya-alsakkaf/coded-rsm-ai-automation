<div class="wk-break-pick" id="breakPick" hidden><div class="wk-bp-card" role="dialog" aria-label="Start a break">
  <div class="wk-bp-h"><svg class="cd-ic"><use href="#i-cup"/></svg>Start a break</div>
  <p class="wk-bp-sub">Pick a length: the timer counts down and shows everyone the return time.</p>
  <div class="wk-bp-chips"><button type="button" data-min="5">5 min</button><button type="button" data-min="10">10 min</button><button type="button" data-min="15">15 min</button><button type="button" data-min="20">20 min</button><button type="button" data-min="30">30 min</button></div>

  <div class="wk-brk-back" id="boBack">Back at <b>-</b></div>
